spring.application.name=ticketing-api
server.port=8084

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketing_db}
spring.datasource.username=${DB_USER:ticketing_user}
spring.datasource.password=${DB_PASSWORD:ticketing_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Flyway
flyway.enabled=true
flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG

#JWT
jwt.secret=${JWT_SECRET:dev_secret_key_minimum_32_characters_required_for_hmac_sha256}
jwt.access.expMinutes=${JWT_ACCESS_EXP_MIN:15}
jwt.refresh.expDays=${JWT_REFRESH_EXP_DAYS:7}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
