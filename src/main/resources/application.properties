spring.application.name=ticketing-api
server.port=8084

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketing_db}
spring.datasource.username=${DB_USER:ticketing_user}
spring.datasource.password=${DB_PASSWORD:ticketing_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


flyway.enabled=true
flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
